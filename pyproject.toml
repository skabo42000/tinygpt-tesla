[project]
name = "tinygpt"
version = "0.1.0"
description = "A small GPT language model built from scratch in PyTorch, one lesson at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.14.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Intel Macs: torch 2.2.2 is the last build, and it needs numpy 1.x.
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "regex>=2026.9.29",
    "tiktoken>=0.14.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# OneDrive + hard links break installs, so copy files instead.
link-mode = "copy"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]
