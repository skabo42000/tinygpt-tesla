[project]
name = "tinygpt"
version = "0.1.0"
description = "A small GPT language model built from scratch in PyTorch, one lesson at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# OneDrive + hard links break installs, so copy files instead.
link-mode = "copy"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
